build:
  # Bumped from cuda 12.1 / python 3.11 (pyannote/whisperx pins). Matches the
  # torch==2.8.0+cu128 pin in requirements.txt, needed because whisperx's
  # GitHub HEAD now requires torch~=2.8.0.
  cuda: "12.8"
  gpu: true
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
  python_version: "3.12"
  python_requirements: requirements.txt
predict: "predict.py:Predictor"