name: Inspect active Replicate deployment
on:
  workflow_dispatch:
  push:
    branches: [feature/nemotron-diarization-jev-confirmation]
    paths: [.github/workflows/inspect-deployment.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read deployment metadata without predictions or input data
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error
          url='https://api.replicate.com/v1/deployments/xiriustech/xirius-whisper-fast'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['REPLICATE_API_TOKEN']})
          try:
            with urllib.request.urlopen(request,timeout=30) as response: data=json.load(response)
            release=data.get('current_release') or {}
            print(json.dumps({'deployment':data.get('name'),'model':release.get('model'),'active_version':release.get('version')}))
          except urllib.error.HTTPError as error:
            print('Deployment metadata unavailable: HTTP',error.code)
            raise SystemExit(1)
