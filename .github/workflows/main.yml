name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        required: true
        description: "xiriustech/whisper-with-darization"

jobs:
  build:
    # replicate/setup-cog@v1.0.2 installs its own fixed CUDA 12.1.0 toolkit
    # (independent of this project's cog.yaml `cuda:` value) via
    # Jimver/cuda-toolkit, whose installer fails to verify gcc on Ubuntu
    # 24.04 ("Failed to verify gcc version"). Pinning 22.04 keeps an older,
    # compatible gcc. This workflow had 0 successful runs before this fix.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Setup Cog
        uses: replicate/setup-cog@v1.0.2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Push to Replicate
        run: |
          cog push r8.im/${{ inputs.model_name }}