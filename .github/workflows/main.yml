name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        required: true
        description: "xiriustech/whisper-with-darization"

jobs:
  build:
    # replicate/setup-cog@v1.0.2 bundles a CUDA-toolkit install (via
    # Jimver/cuda-toolkit) that isn't actually needed just to build and push
    # a Docker image -- CUDA only matters at inference time, on Replicate's
    # own GPUs. That bundled installer failed on both ubuntu-latest (gcc
    # too new) and ubuntu-22.04 (a follow-up bug uploading its own failure
    # log as a build artifact masked the real error). This workflow had 0
    # successful runs ever. Installing the cog CLI directly sidesteps all
    # of that.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install Cog CLI
        # Pinned to the same version replicate/setup-cog@v1.0.2 installs
        # (v0.8.0-beta3). The "latest" cog release rejects a plain
        # REPLICATE_API_TOKEN for `cog login --token-stdin` ("that looks
        # like a Replicate API token, not a CLI auth token"); this older,
        # officially-tested version accepts it -- and `docker push` needs
        # that login to have configured registry auth, which just setting
        # REPLICATE_API_TOKEN as an env var for `cog push` did not do
        # ("authorization failed").
        run: |
          sudo curl -o /usr/local/bin/cog -L "https://github.com/replicate/cog/releases/download/v0.8.0-beta3/cog_Linux_x86_64"
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Log in to Replicate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: echo "$REPLICATE_API_TOKEN" | cog login --token-stdin

      - name: Push to Replicate
        run: cog push r8.im/${{ inputs.model_name }}