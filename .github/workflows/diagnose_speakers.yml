name: Diagnose speaker model version
on:
  push:
    branches: [feature/nemotron-diarization-jev-confirmation]
    paths: ['.github/scripts/diagnose_speakers.py', '.github/workflows/diagnose_speakers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read deployment and model version metadata only
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python3 .github/scripts/diagnose_speakers.py
